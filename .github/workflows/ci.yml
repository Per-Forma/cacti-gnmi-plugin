name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install RRDtool development libraries
        run: sudo apt-get update && sudo apt-get install -y librrd-dev rrdtool

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: scripts/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest

  php:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.5"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          mapfile -d '' files < <(find . -name '*.php' -print0)
          for file in "${files[@]}"; do
            php -l "$file"
          done

  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP for package inspection
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Reject generated or sensitive artifacts
        shell: bash
        run: |
          forbidden=$(find . -path './.git' -prune -o -type f \( \
            -name '*.rrd' -o -name '*.pem' -o -name '*.key' -o \
            -name '*.crt' -o -name '*.p12' -o -name '*.pfx' -o \
            -name '*.pyc' -o -name '.env' -o -name '.coverage' \
          \) -print)
          if [[ -n "$forbidden" ]]; then
            printf 'Forbidden repository artifacts:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Validate metadata
        shell: bash
        run: |
          setup_version=$(sed -nE "s/.*'version'[[:space:]]*=>[[:space:]]*'([^']+)'.*/\1/p" setup.php | head -1)
          info_version=$(awk -F ' *= *' '$1 == "version" { print $2; exit }' INFO)
          test "$setup_version" = "$info_version"
          test "$(awk -F ' *= *' '$1 == "compat" { print $2; exit }' INFO)" = "1.2.25+"
          test "$(awk -F ' *= *' '$1 == "license" { print $2; exit }' INFO)" = "GPL-2.0-or-later"

      - name: Validate public documentation
        run: python -m unittest tests.test_public_docs

      - name: Smoke-test prerelease packaging
        run: deployment/package_release.sh --allow-dirty 1.0.0-beta.3

      - name: Inspect packaged artifact
        shell: bash
        run: |
          tarball=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$tarball"
          tar tzf "$tarball" >/dev/null
          (
            cd "$(dirname "$tarball")"
            shasum -a 256 -c "$(basename "$tarball").sha256"
          )
          extract_dir="$RUNNER_TEMP/gnmi-package"
          mkdir -p "$extract_dir"
          tar xzf "$tarball" -C "$extract_dir"
          package_root=$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$package_root"
          test -f "$package_root/gnmi/ajax_handler.php"
          test -f "$package_root/gnmi/include/subscription_actions.php"
          find "$package_root/gnmi" -name '*.php' -print0 | xargs -0 -n1 php -l
          (
            cd "$package_root"
            shasum -a 256 -c CHECKSUMS.txt
          )
          python -m tests.public_docs_validator "$extract_dir" --source-docs docs

      - name: Preserve the inspected package
        uses: actions/upload-artifact@v4
        with:
          name: gnmi-package
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  php-harness:
    needs: repository
    name: Cacti 1.2.31 PHP harnesses
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure disposable Cacti stack
        shell: bash
        run: |
          env_file=tests/integration/cacti_compat/.env
          {
            echo "TZ=UTC"
            echo "COMPOSE_PROJECT_NAME=gnmi-ci"
            echo "CACTI_VERSION=1.2.31"
            echo "CACTI_COMMIT=1e8eaca26b84b128c39ce8cc8ece42d7ff76aac1"
            echo "CACTI_TARBALL_SHA256=fcc37e877e3e4c937a9cd245101784bc0961a0652f542660e8dce1e86c4e3a15"
            echo "CACTI_IMAGE=gnmi-cacti-ci:1.2.31"
            echo "CACTI_CONTAINER=gnmi_cacti_ci"
            echo "DB_CONTAINER=gnmi_cacti_ci_db"
            echo "STATE_DIR=$RUNNER_TEMP/gnmi-cacti-ci"
            echo "CACTI_UI_BIND=127.0.0.1"
            echo "CACTI_UI_PORT=7083"
            echo "MARIADB_IMAGE=mariadb:10.6.21"
            echo "MARIADB_DATABASE=cacti"
            echo "MARIADB_USER=cacti"
            echo "MARIADB_PASSWORD=ci-database-password"
            echo "MARIADB_ROOT_PASSWORD=ci-root-password"
          } >"$env_file"
          mkdir -p "$RUNNER_TEMP/gnmi-cacti-ci"/{db,rra,log,cache,plugin}

      - name: Start Cacti
        shell: bash
        run: |
          docker compose \
            --env-file tests/integration/cacti_compat/.env \
            -f tests/integration/cacti_compat/compose.yaml \
            up -d --build
          for attempt in $(seq 1 90); do
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' gnmi_cacti_ci 2>/dev/null || true)
            if [[ "$health" == healthy ]]; then
              exit 0
            fi
            sleep 5
          done
          docker logs gnmi_cacti_ci
          exit 1

      - name: Download the inspected package
        uses: actions/download-artifact@v8
        with:
          name: gnmi-package
          path: dist

      - name: Accept the packaged installation
        env:
          PACKAGE_EVIDENCE_DIR: ${{ runner.temp }}/package-evidence
        run: |
          tests/integration/package/accept.sh \
            dist/cacti-gnmi-plugin-1.0.0-beta.3-dirty.tar.gz \
            dist/cacti-gnmi-plugin-1.0.0-beta.3-dirty.tar.gz.sha256 \
            gnmi_cacti_ci http://127.0.0.1:7083/cacti/

      - name: Upload package acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-acceptance
          path: ${{ runner.temp }}/package-evidence
          if-no-files-found: warn

      - name: Show Cacti logs after failure
        if: failure()
        run: |
          docker logs gnmi_cacti_ci || true
          docker exec gnmi_cacti_ci tail -n 300 /var/www/html/cacti/log/cacti.log || true

      - name: Stop disposable stack
        if: always()
        run: |
          docker compose \
            --env-file tests/integration/cacti_compat/.env \
            -f tests/integration/cacti_compat/compose.yaml \
            down --remove-orphans
